server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers are declared per-location (not at server level) on
    # purpose: nginx's add_header inheritance rule discards ALL server-level
    # add_header directives for any location that declares its own (e.g. the
    # Cache-Control override in `location /` below) - mixing server- and
    # location-level add_header silently drops headers on that route. Every
    # location that serves a response to a browser repeats the full set
    # instead. /api/ is exempt: it's proxied straight to the backend, which
    # already sets these via backend/middleware/security_headers.py.
    #
    # The `generic.nginx.security.header-redefinition.header-redefinition`
    # semgrep rule fires on every add_header inside any location block,
    # including this correct, complete, non-conflicting one (verified: it
    # also fires on `location = /health` below, which has no server-level
    # add_header to conflict with at all) - it is a blanket pattern match,
    # not a real completeness check, so each occurrence below is suppressed
    # with a documented nosemgrep rather than removed.
    location = /health {
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition -- known false positive, see comment at top of file
        add_header X-Content-Type-Options "nosniff" always;
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Referrer-Policy "no-referrer" always;
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Frame-Options "DENY" always;
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; base-uri 'none'; form-action 'self'" always;
        default_type application/json;
        return 200 '{"status":"healthy","service":"frontend"}';
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        # The first document upload or chat message after a fresh backend
        # start computes an embedding synchronously within the request -
        # this is a genuine cold-start cost (ONNX Runtime session init,
        # ~20-90s depending on the machine, measured directly in this
        # project's own testing), not a hang. 10s was nowhere near enough
        # margin: verified directly with a real cold-start upload through
        # this exact proxy, which returned a genuine 504 Gateway Timeout
        # at ~10.3s while the backend was still processing. Every later
        # request in the same backend process stays well under a second.
        proxy_read_timeout 120s;
    }

    location /static/ {
        # Named `/static/`, not `/assets/`, so it never shadows this app's
        # own `/assets` (Asset Inventory) SPA route - see vite.config.ts.
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition -- known false positive, see comment at top of file
        add_header X-Content-Type-Options "nosniff" always;
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Referrer-Policy "no-referrer" always;
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Frame-Options "DENY" always;
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; base-uri 'none'; form-action 'self'" always;
        expires 1h;
    }

    location / {
        # index.html references content-hashed bundle filenames
        # (index-<hash>.js/css) that change on every build and get replaced
        # on disk - a browser that cached index.html itself (nginx sends no
        # explicit Cache-Control here by default, so browsers may cache it
        # heuristically) keeps requesting a bundle hash that no longer
        # exists, 404s, and the app never mounts: a silent blank white
        # screen with no error banner. no-cache forces a revalidation
        # request on every load, so a rebuilt index.html (and the bundle
        # hash it points to) is always picked up immediately.
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition -- known false positive, see comment at top of file
        add_header X-Content-Type-Options "nosniff" always;
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Referrer-Policy "no-referrer" always;
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header X-Frame-Options "DENY" always;
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; base-uri 'none'; form-action 'self'" always;
        # nosemgrep: generic.nginx.security.header-redefinition.header-redefinition
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
